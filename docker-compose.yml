services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-sales-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sales_agent
      POSTGRES_PASSWORD: sales_agent_local_password
      POSTGRES_DB: ai_sales_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_agent -d ai_sales_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-sales-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
